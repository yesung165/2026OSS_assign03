<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lakers Roster Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="my.css">
</head>
<body>

<header class="court-header">
  <nav class="navbar">
    <div class="container page-shell d-flex align-items-center justify-content-between flex-wrap" style="padding-top: 0.75rem; padding-bottom: 0.75rem; row-gap: 0.5rem;">
      <a class="navbar-brand" href="index.html">LAKERS <span class="brand-sub">ROSTER MANAGER</span></a>
      <ul class="navbar-nav d-flex flex-row align-items-center gap-2 gap-md-3 mb-0">
        <li class="nav-item"><a class="nav-link active" href="index.html">Roster</a></li>
        <li class="nav-item"><a class="btn btn-add" href="add.html">+ Add Player</a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="page-shell">
  <div class="page-heading">
    <div>
      <h1>Current Roster</h1>
      <p id="rosterCount">Loading players…</p>
    </div>
  </div>

  <!-- Desktop table -->
  <table class="roster-table" id="rosterTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Position</th>
        <th>Salary</th>
      </tr>
    </thead>
    <tbody id="rosterTableBody"></tbody>
  </table>

  <!-- Mobile cards -->
  <div class="roster-cards" id="rosterCards"></div>

  <div class="empty-state d-none" id="emptyState">
    <p class="mb-2">No players on the roster yet.</p>
    <a href="add.html" class="btn-court-primary btn">Add your first player</a>
  </div>

  
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

const STORAGE_KEY = "lakersRoster";


const SEED_PLAYERS = [
  {
    id: 1,
    name: "LeBron James",
    number: 23,
    position: "SF",
    height: "6'9\"",
    age: 40,
    salary: 48728845,
    college: "St. Vincent-St. Mary HS",
  },
  {
    id: 2,
    name: "Anthony Davis",
    number: 3,
    position: "PF",
    height: "6'10\"",
    age: 32,
    salary: 43219440,
    college: "Kentucky",
  },
  {
    id: 3,
    name: "Austin Reaves",
    number: 15,
    position: "SG",
    height: "6'5\"",
    age: 27,
    salary: 13887000,
    college: "Oklahoma",
  },
  {
    id: 4,
    name: "Rui Hachimura",
    number: 28,
    position: "PF",
    height: "6'8\"",
    age: 27,
    salary: 17000000,
    college: "Gonzaga",
  },
  {
    id: 5,
    name: "D'Angelo Russell",
    number: 1,
    position: "PG",
    height: "6'4\"",
    age: 29,
    salary: 18692307,
    college: "Ohio State",
  },
];

function loadPlayers() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_PLAYERS));
    return [...SEED_PLAYERS];
  }
  try {
    return JSON.parse(raw);
  } catch (e) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_PLAYERS));
    return [...SEED_PLAYERS];
  }
}

function savePlayers(players) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
}

function getPlayerById(id) {
  const players = loadPlayers();
  return players.find((p) => String(p.id) === String(id));
}

function addPlayer(player) {
  const players = loadPlayers();
  const nextId =
    players.length > 0 ? Math.max(...players.map((p) => p.id)) + 1 : 1;
  player.id = nextId;
  players.push(player);
  savePlayers(players);
  return player;
}

function updatePlayer(id, updated) {
  const players = loadPlayers();
  const index = players.findIndex((p) => String(p.id) === String(id));
  if (index === -1) return null;
  players[index] = { ...players[index], ...updated, id: players[index].id };
  savePlayers(players);
  return players[index];
}

function deletePlayer(id) {
  const players = loadPlayers();
  const filtered = players.filter((p) => String(p.id) !== String(id));
  savePlayers(filtered);
}

function formatSalary(amount) {
  return "$" + Number(amount).toLocaleString("en-US");
}

function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}
</script>
<script>
  function renderRoster() {
    const players = loadPlayers();
    const tbody = document.getElementById("rosterTableBody");
    const cardsWrap = document.getElementById("rosterCards");
    const countLabel = document.getElementById("rosterCount");
    const emptyState = document.getElementById("emptyState");
    const table = document.getElementById("rosterTable");

    tbody.innerHTML = "";
    cardsWrap.innerHTML = "";

    if (players.length === 0) {
      emptyState.classList.remove("d-none");
      table.classList.add("d-none");
      countLabel.textContent = "0 players on the roster";
      return;
    }

    emptyState.classList.add("d-none");
    countLabel.textContent = `${players.length} player${players.length === 1 ? "" : "s"} on the roster`;

    players.forEach((p) => {
      // Desktop row
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><span class="jersey-badge">${p.number}</span></td>
        <td><span class="player-name">${p.name}</span></td>
        <td><span class="pos-tag">${p.position}</span></td>
        <td class="salary-cell">${formatSalary(p.salary)}</td>
      `;
      tr.addEventListener("click", () => {
        window.location.href = `view.html?id=${p.id}`;
      });
      tbody.appendChild(tr);

      // Mobile card
      const card = document.createElement("div");
      card.className = "roster-card";
      card.innerHTML = `
        <span class="jersey-badge">${p.number}</span>
        <div class="info">
          <span class="player-name">${p.name}</span>
          <div class="meta">${p.position} &middot; ${formatSalary(p.salary)}</div>
        </div>
      `;
      card.addEventListener("click", () => {
        window.location.href = `view.html?id=${p.id}`;
      });
      cardsWrap.appendChild(card);
    });
  }

  renderRoster();
</script>
</body>
</html>
