<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Profile — Lakers Roster Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="my.css" />
  </head>
  <body>
    <header class="court-header">
      <nav class="navbar navbar-expand-md">
        <div
          class="container page-shell"
          style="padding-top: 0.75rem; padding-bottom: 0.75rem"
        >
          <a class="navbar-brand" href="index.html"
            >LAKERS <span class="brand-sub">ROSTER MANAGER</span></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navContent"
            style="border-color: rgba(255, 255, 255, 0.4)"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-end"
            id="navContent"
          >
            <ul class="navbar-nav align-items-md-center gap-md-3">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Roster</a>
              </li>
              <li class="nav-item mt-2 mt-md-0">
                <a class="btn btn-add" href="add.html">+ Add Player</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      <div class="page-heading">
        <div>
          <h1>Player Profile</h1>
          <p><a href="index.html">&larr; Back to roster</a></p>
        </div>
      </div>

      <div id="profileWrap"></div>

      <div class="empty-state d-none" id="notFound">
        <p class="mb-2">
          That player couldn't be found. It may have been deleted.
        </p>
        <a href="index.html" class="btn-court-primary btn">Back to roster</a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const STORAGE_KEY = "lakersRoster";

      // Sample data used only the very first time the site loads on a browser.
      const SEED_PLAYERS = [
        {
          id: 1,
          name: "LeBron James",
          number: 23,
          position: "SF",
          height: "6'9\"",
          age: 40,
          salary: 48728845,
          college: "St. Vincent-St. Mary HS",
        },
        {
          id: 2,
          name: "Anthony Davis",
          number: 3,
          position: "PF",
          height: "6'10\"",
          age: 32,
          salary: 43219440,
          college: "Kentucky",
        },
        {
          id: 3,
          name: "Austin Reaves",
          number: 15,
          position: "SG",
          height: "6'5\"",
          age: 27,
          salary: 13887000,
          college: "Oklahoma",
        },
        {
          id: 4,
          name: "Rui Hachimura",
          number: 28,
          position: "PF",
          height: "6'8\"",
          age: 27,
          salary: 17000000,
          college: "Gonzaga",
        },
        {
          id: 5,
          name: "D'Angelo Russell",
          number: 1,
          position: "PG",
          height: "6'4\"",
          age: 29,
          salary: 18692307,
          college: "Ohio State",
        },
      ];

      function loadPlayers() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_PLAYERS));
          return [...SEED_PLAYERS];
        }
        try {
          return JSON.parse(raw);
        } catch (e) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_PLAYERS));
          return [...SEED_PLAYERS];
        }
      }

      function savePlayers(players) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
      }

      function getPlayerById(id) {
        const players = loadPlayers();
        return players.find((p) => String(p.id) === String(id));
      }

      function addPlayer(player) {
        const players = loadPlayers();
        const nextId =
          players.length > 0 ? Math.max(...players.map((p) => p.id)) + 1 : 1;
        player.id = nextId;
        players.push(player);
        savePlayers(players);
        return player;
      }

      function updatePlayer(id, updated) {
        const players = loadPlayers();
        const index = players.findIndex((p) => String(p.id) === String(id));
        if (index === -1) return null;
        players[index] = {
          ...players[index],
          ...updated,
          id: players[index].id,
        };
        savePlayers(players);
        return players[index];
      }

      function deletePlayer(id) {
        const players = loadPlayers();
        const filtered = players.filter((p) => String(p.id) !== String(id));
        savePlayers(filtered);
      }

      function formatSalary(amount) {
        return "$" + Number(amount).toLocaleString("en-US");
      }

      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }
    </script>
    <script>
      const id = getQueryParam("id");
      const player = id ? getPlayerById(id) : null;
      const wrap = document.getElementById("profileWrap");
      const notFound = document.getElementById("notFound");

      if (!player) {
        notFound.classList.remove("d-none");
      } else {
        wrap.innerHTML = `
      <div class="player-profile">
        <div class="profile-top">
          <span class="jersey-badge">${player.number}</span>
          <div>
            <h2>${player.name}</h2>
            <span class="pos-tag">${player.position}</span>
          </div>
        </div>
        <div class="detail-grid">
          <div class="detail-item">
            <div class="detail-label">Jersey number</div>
            <div class="detail-value">#${player.number}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Position</div>
            <div class="detail-value">${player.position}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Height</div>
            <div class="detail-value">${player.height}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Age</div>
            <div class="detail-value">${player.age}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Annual salary</div>
            <div class="detail-value">${formatSalary(player.salary)}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">College / prior team</div>
            <div class="detail-value">${player.college || "—"}</div>
          </div>
        </div>
        <div class="profile-actions">
          <a href="edit.html?id=${player.id}" class="btn-court-primary btn">Edit</a>
          <button type="button" class="btn-court-danger btn" id="deleteBtn">Delete</button>
        </div>
      </div>
    `;

        document
          .getElementById("deleteBtn")
          .addEventListener("click", function () {
            const confirmed = confirm(
              `정말 ${player.name} 선수를 삭제하시겠습니까?`,
            );
            if (confirmed) {
              deletePlayer(player.id);
              window.location.href = "index.html";
            }
          });
      }
    </script>
  </body>
</html>
